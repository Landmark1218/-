<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>迫真空手部 - 公式サイト</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: "ヒラギノ角ゴ Pro W3", "メイリオ", sans-serif; 
            background-color: #111;
            background-image: url('Back.png');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: #fff; 
            overflow-x: hidden; 
        }

        .header-area {
            width: 100%; 
            height: 80px; 
            background: rgba(0,0,0,0.85);
            position: fixed; 
            top: 0; 
            left: 0; 
            z-index: 100;
            border-bottom: 2px solid #ff3300;
        }

        .logo-text {
            float: left;
            font-size: 34px; 
            font-weight: bold; 
            color: #ff3300;
            margin-top: 18px; 
            margin-left: 30px;
            text-shadow: 0 0 10px #ff3300;
            letter-spacing: 2px;
        }

        .sns-btn {
            float: left;
            margin-top: 15px;
            margin-left: 30px;
            cursor: pointer;
        }

        .sns-btn img {
            height: 50px;
            border-radius: 8px;
            border: 2px solid #555;
            transition: transform 0.2s;
        }

        .sns-btn img:hover {
            transform: scale(1.1);
            border-color: #fff;
        }

        .news-area {
            float: right;
            width: 320px; 
            height: 40px;
            margin-top: 20px; 
            margin-right: 30px;
            background: rgba(255,255,255,0.1);
            border: 1px solid #555;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
        }

        .news-item {
            position: absolute;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            line-height: 40px; 
            text-align: center; 
            font-size: 14px;
            color: #00ffcc;
            transition: all 0.6s ease;
            opacity: 0;
            transform: translateX(100%);
        }

        .main-center {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .catch-copy {
            font-size: 48px;
            margin-bottom: 50px;
            font-weight: bold;
            text-shadow: 2px 2px 5px #000, 0 0 15px #ff3300;
            animation: fuwafuwa 3s infinite;
        }

        @keyframes fuwafuwa {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .btn-green {
            background: linear-gradient(to bottom, #00ee00, #009900);
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            padding: 20px 80px;
            border: 3px solid #fff;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 25px #00ff00;
            transition: all 0.2s;
        }

        .btn-green:hover {
            background: linear-gradient(to bottom, #00ff00, #00aa00);
            transform: scale(1.05);
            box-shadow: 0 0 40px #00ff00;
        }

        .section-wrap {
            width: 100%;
            position: relative;
            padding-top: 100px;
            box-sizing: border-box;
            background: rgba(0,0,0,0.4);
        }

        .sec-title {
            font-size: 42px;
            font-weight: bold;
            font-style: italic;
            color: #fff;
            margin-left: 5vw;
            border-left: 8px solid #ff3300;
            padding-left: 15px;
            text-shadow: 2px 2px 4px #000;
        }

        .sec-subtitle {
            font-size: 18px;
            color: #aaa;
            margin-left: 5vw;
            letter-spacing: 5px;
            margin-bottom: 40px;
        }

        .char-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 80%;
            margin: 0 auto 100px auto;
            border-bottom: 1px solid #444;
            padding-bottom: 50px;
        }

        .char-info-box {
            width: 45%;
        }

        .char-rank-area {
            display: flex;
            align-items: baseline;
        }

        .c-rank-letter {
            font-size: 70px;
            color: #b366ff;
            font-weight: bold;
            font-style: italic;
            text-shadow: 2px 2px 0px #000;
        }

        .c-rank-text {
            font-size: 20px;
            color: #b366ff;
            font-weight: bold;
            margin-left: 5px;
        }

        .c-name {
            font-size: 80px;
            font-weight: bold;
            margin-top: -15px;
            text-shadow: 3px 3px 0px #000;
        }

        .c-role-box {
            display: inline-block;
            background: #ff3366;
            color: #fff;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 26px;
            font-weight: bold;
            margin-top: 30px;
            box-shadow: 3px 3px 0px #000;
        }

        .c-desc {
            font-size: 20px;
            color: #ddd;
            margin-top: 20px;
            line-height: 1.5;
            text-shadow: 1px 1px 2px #000;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-left: 4px solid #b366ff;
            width: 100%;
        }

        .char-img-box {
            width: 50%;
            height: 60vh;
            text-align: right;
        }

        .char-img-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .event-box {
            width: 80%;
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(0,0,0,0.8);
            border: 2px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .e-banner img {
            width: 100%;
            display: block;
            border-bottom: 4px solid #ff3300;
        }

        .e-text-area {
            padding: 30px;
        }

        .e-name {
            font-size: 36px;
            font-weight: bold;
            color: #ff3366;
            margin-bottom: 15px;
        }

        .e-desc {
            font-size: 22px;
            line-height: 1.6;
        }

        #video-wrap {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 9999;
        }

        #myVideo {
            width: 100vw; height: 100vh; object-fit: contain;
        }
    </style>
</head>
<body>

<div class="header-area">
    <div class="logo-text">迫真空手部</div>
    
    <a href="https://x.com/Landmark0920" target="_blank" class="sns-btn">
        <img src="https://image.itmedia.co.jp/news/articles/2307/24/cover_news139.jpg" alt="公式X">
    </a>

    <div class="news-area">
        <div class="news-item" id="news-1">【お知らせ】事前登録1145141919810人突破！</div>
        <div class="news-item" id="news-2">【アップデート】新キャラクター追加</div>
        <div class="news-item" id="news-3">【メンテ】明日810時からサーバーメンテナンスです</div>
    </div>
</div>

<div class="main-center">
    <div class="catch-copy">さぁ、究極の闘いへーー</div>
    <button class="btn-green" id="dlBtn">GAME DOWNLOAD</button>
</div>

<div class="section-wrap">
    <div class="sec-title">キャラクター</div>
    <div class="sec-subtitle">CHARACTER INFO</div>

    <div class="char-row">
        <div class="char-info-box">
            <div class="char-rank-area">
                <div class="c-rank-letter">S</div>
                <div class="c-rank-text">RANK</div>
            </div>
            <div class="c-name">野獣先輩</div>
            <div class="c-role-box">メインアタッカー</div>
            <div class="c-desc">睡眠薬で相手を眠らせ隙を突け！</div>
        </div>
        <div class="char-img-box">
            <img src="Yaju.png">
        </div>
    </div>

    <div class="char-row">
        <div class="char-info-box">
            <div class="char-rank-area">
                <div class="c-rank-letter">A</div>
                <div class="c-rank-text">RANK</div>
            </div>
            <div class="c-name">三浦大先輩</div>
            <div class="c-role-box">ディフェンダー</div>
            <div class="c-desc">相手の攻撃に便乗して吸収しろ！</div>
        </div>
        <div class="char-img-box">
            <img src="MUR.png">
        </div>
    </div>

    <div class="char-row" style="border-bottom: none;">
        <div class="char-info-box">
            <div class="char-rank-area">
                <div class="c-rank-letter">A</div>
                <div class="c-rank-text">RANK</div>
            </div>
            <div class="c-name">木村</div>
            <div class="c-role-box">サポーター</div>
            <div class="c-desc">戦況をチラチラ分析し頭脳で立ち向かえ！</div>
        </div>
        <div class="char-img-box">
            <img src="KMR.png">
        </div>
    </div>
</div>

<div class="section-wrap" style="padding-bottom: 100px;">
    <div class="sec-title">イベント</div>
    <div class="sec-subtitle">EVENT INFO</div>

    <div class="event-box">
        <div class="e-banner">
            <img src="Event.png">
        </div>
        <div class="e-text-area">
            <div class="e-name">うまいラーメン屋台</div>
            <div class="e-desc">ラーメンをタイミングよく具材を入れて作る</div>
        </div>
    </div>
</div>

<div id="video-wrap">
    <video id="myVideo" src="Potter.mp4" playsinline></video>
</div>

<script>
    var currentSlide = 0;
    
    var n1 = document.getElementById("news-1");
    var n2 = document.getElementById("news-2");
    var n3 = document.getElementById("news-3");
    
    var newsList = new Array();
    newsList[0] = n1;
    newsList[1] = n2;
    newsList[2] = n3;

    newsList[0].style.opacity = "1";
    newsList[0].style.transform = "translateX(0%)";

    var slideFunc = function() {
        var i = 0;
        while(i < newsList.length) {
            newsList[i].style.opacity = "0";
            newsList[i].style.transform = "translateX(100%)";
            i = i + 1;
        }

        currentSlide = currentSlide + 1;
        if(currentSlide >= newsList.length) {
            currentSlide = 0;
        }

        var tgt = newsList[currentSlide];
        
        tgt.style.transition = "none";
        tgt.style.transform = "translateX(-100%)"; 
        
        setTimeout(function(){
            tgt.style.transition = "all 0.6s ease";
            tgt.style.opacity = "1";
            tgt.style.transform = "translateX(0%)";
        }, 50); 
    };

    setInterval(slideFunc, 4000);

    var theBtn = document.getElementById("dlBtn");
    var vWrap = document.getElementById("video-wrap");
    var vPlayer = document.getElementById("myVideo");
    
    var isPushed = false;

    theBtn.onclick = function() {
        if(isPushed == false) {
            isPushed = true;

            vWrap.style.display = "block";
            vPlayer.muted = false;

            var playPrm = vPlayer.play();
            
            if(playPrm !== undefined) {
                playPrm.then(function(){
                    var targetDom = document.documentElement;
                    
                    if(targetDom.requestFullscreen) {
                        targetDom.requestFullscreen();
                    } else if(targetDom.webkitRequestFullscreen) {
                        targetDom.webkitRequestFullscreen();
                    } else if(targetDom.mozRequestFullScreen) {
                        targetDom.mozRequestFullScreen();
                    }
                }).catch(function(err){
                    var e_msg = err;
                    isPushed = false;
                    vWrap.style.display = "none";
                });
            }
        }
    };
</script>

</body>
</html>
