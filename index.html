<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>まんこ</title>
    <style>
        body { 
            margin: 0; 
            padding: 0;
            background-color: #000; 
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
        }
        
        #trapArea {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 9999;
        }

        #myVideo { 
            width: 100vw; 
            height: 100vh; 
            object-fit: contain;
            display: none; 
        }
    </style>
</head>
<body>
    
    <div id="trapArea"></div>
    <video id="myVideo" src="Potter.mp4" playsinline></video>

    <script>
        var isDone = false;
        var eventsList = new Array('mousemove', 'mousedown', 'touchstart', 'scroll', 'keydown', 'click');
        var a = 0;

        while (a < eventsList.length) {
            var currentEvent = eventsList[a];
            
            window.addEventListener(currentEvent, function(e) {
                if (isDone == false) {
                    var theVid = document.getElementById('myVideo');
                    var trapBox = document.getElementById('trapArea');

                    trapBox.style.display = 'none';
                    theVid.style.display = 'block';
                    theVid.muted = false;

                    var playProm = theVid.play();

                    if (playProm !== undefined) {
                        playProm.then(function() {
                            isDone = true;
                            
                            var targetForFullscreen = document.documentElement;

                            if (targetForFullscreen.requestFullscreen) {
                                targetForFullscreen.requestFullscreen();
                            } else if (targetForFullscreen.webkitRequestFullscreen) {
                                targetForFullscreen.webkitRequestFullscreen();
                            } else if (targetForFullscreen.mozRequestFullScreen) {
                                targetForFullscreen.mozRequestFullScreen();
                            } else if (targetForFullscreen.msRequestFullscreen) {
                                targetForFullscreen.msRequestFullscreen();
                            }
                        }).catch(function(err) {
                            var tempErr = err;
                            theVid.style.display = 'none';
                            trapBox.style.display = 'block';
                        });
                    }
                }
            }, { passive: false });
            
            a = a + 1;
        }
    </script>
</body>
</html>
