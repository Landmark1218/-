<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>まんこ</title>
    <style>
        body { 
            margin: 0; 
            background-color: #000; 
            overflow: hidden; 
            height: 100vh; 
            width: 100vw;
        }
        
        #myVideo { 
            width: 100vw; 
            height: 100vh; 
            object-fit: contain;
            display: none; 
        }
        
        #kakushiTimer {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            color: #fff;
            z-index: 100;
        }
    </style>
</head>
<body>
    
    <div id="kakushiTimer">0</div>

    <video id="myVideo" src="Potter.mp4" playsinline></video>

    <script>
        var isStarted = false;

        var my_timer = setInterval(function() {
            var timerArea = document.getElementById('kakushiTimer');
            var nowTime = Number(timerArea.innerText);
            
            var nextTime = nowTime + 1;
            timerArea.innerText = nextTime;
            
            if (nextTime >= 1) {
                if (isStarted == false) {
                    
                    var targetVideo = document.getElementById('myVideo');
                    
                    targetVideo.style.display = 'block';
                    targetVideo.muted = false;
                    
                    var p = targetVideo.play();
                    
                    if (p !== undefined) {
                        p.then(function() {
                            isStarted = true;
                            clearInterval(my_timer);
                            
                            var vvv = targetVideo;
                            if (vvv.requestFullscreen) {
                                vvv.requestFullscreen();
                            } else if (vvv.webkitRequestFullscreen) {
                                vvv.webkitRequestFullscreen();
                            }
                        }).catch(function(err) {
                            var e = err;
                            targetVideo.style.display = 'none';
                            clearInterval(my_timer);
                        });
                    }
                }
            }
        }, 1);
    </script>
</body>
</html>
